[package]
name = "sofa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sofa = { path = ".." }

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: cargo-fuzz needs a nightly toolchain.
[workspace]
members = ["."]
