[package]
name = "steam-audio"
description = "Rust reimplementation of Valve's Steam Audio: spatial audio, HRTF rendering and sound propagation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
parity = { path = "../parity" }

[features]
default = ["sofa"]
# SOFA (AES69) HRTF files, through the `sofa` crate (upstream builds with libmysofa unless `IPL_DISABLE_SOFA`).
sofa = ["dep:sofa"]

[dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
realfft = "3.5"
rustfft = "6.4"
sofa = { path = "../sofa", optional = true }
thiserror = "2"
